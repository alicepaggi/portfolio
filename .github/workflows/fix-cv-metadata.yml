name: Fix CV PDF metadata

on:
  push:
    paths:
      - ".github/workflows/fix-cv-metadata.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Add temporary CV metadata fixer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix PDF metadata
        run: |
          python -m pip install pypdf
          python - <<'PY'
          from pypdf import PdfReader, PdfWriter

          path = "cv/Alice_Paggi_CV_2026.pdf"
          reader = PdfReader(path)
          writer = PdfWriter()

          for page in reader.pages:
              writer.add_page(page)

          metadata = dict(reader.metadata or {})
          metadata["/Title"] = "Alice Paggi | QA Specialist · Test Engineer"
          metadata["/Author"] = "Alice Paggi"
          writer.add_metadata(metadata)

          with open(path, "wb") as f:
              writer.write(f)
          PY

      - name: Commit corrected PDF and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-cv-metadata.yml
          git add cv/Alice_Paggi_CV_2026.pdf .github/workflows/fix-cv-metadata.yml
          git commit -m "Fix CV PDF metadata"
          git push
