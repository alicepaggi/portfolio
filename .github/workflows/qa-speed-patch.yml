name: Apply QA Lab speed patch

on:
  push:
    paths:
      - '.github/workflows/qa-speed-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply frontend speed updates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/main.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));\n\n", "")
          old_poll = "      pollTimer = window.setTimeout(() => poll(runId), 2500);"
          new_poll = "      pollTimer = window.setTimeout(() => poll(runId), 1500);"
          if old_poll not in s:
              raise SystemExit('Polling interval pattern not found')
          s = s.replace(old_poll, new_poll, 1)
          old_start = "      actionHint.textContent = `Workflow queued: 0/${TOTAL_TESTS} tests passed.`;\n      await sleep(2500);\n      const latest = await getStatus();\n      renderStatus(latest);\n      poll(latest.id);"
          new_start = "      actionHint.textContent = `Workflow queued: 0/${TOTAL_TESTS} tests passed.`;\n      const runId = result.run_id || null;\n      if (runId) {\n        const latest = await getStatus(runId);\n        renderStatus(latest);\n        poll(runId);\n      } else {\n        poll();\n      }"
          if old_start not in s:
              raise SystemExit('Initial wait pattern not found')
          s = s.replace(old_start, new_start, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit frontend speed updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/main.js
          git commit -m 'Speed up QA Lab live updates'
          git push