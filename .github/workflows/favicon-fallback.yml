name: Temporary favicon fallback
on:
  push:
    paths:
      - '.github/workflows/favicon-fallback.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add ICO fallback and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          link = '  <link rel="icon" href="favicon.ico" type="image/x-icon">\n'
          if link not in s:
              marker = '  <link rel="icon" href="assets/ap-mark.svg" type="image/svg+xml">\n'
              if marker in s:
                  s = s.replace(marker, marker + link, 1)
              else:
                  title = '  <title>Alice Paggi | QA Specialist · Test Engineer</title>\n'
                  s = s.replace(title, title + link, 1)
          p.write_text(s)
          PY
          rm .github/workflows/favicon-fallback.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/favicon-fallback.yml
          git commit -m 'Add ICO favicon fallback'
          git push
