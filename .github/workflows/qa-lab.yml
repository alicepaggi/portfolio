name: QA Lab — Playwright E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'work/**'
      - 'assets/**'
      - 'e2e/**'
      - '.github/workflows/qa-lab.yml'

permissions:
  contents: read

jobs:
  chromium:
    name: Chromium — full suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Homepage smoke tests [6]
        run: npx playwright test tests/01-homepage.spec.js --project=chromium-desktop

      - name: Run Main navigation [10]
        if: success() || failure()
        run: npx playwright test tests/02-navigation.spec.js --project=chromium-desktop

      - name: Run Case studies [7]
        if: success() || failure()
        run: npx playwright test tests/03-case-studies.spec.js --project=chromium-desktop

      - name: Run External links [6]
        if: success() || failure()
        run: npx playwright test tests/04-external-links.spec.js --project=chromium-desktop

      - name: Run Interactive components [6]
        if: success() || failure()
        run: npx playwright test tests/05-interactive-components.spec.js --project=chromium-desktop

      - name: Run Responsive layout [8]
        if: success() || failure()
        run: npx playwright test tests/06-responsive.spec.js --project=chromium-desktop

      - name: Run Current sections [9]
        if: success() || failure()
        run: npx playwright test tests/07-current-sections.spec.js --project=chromium-desktop

      - name: Upload Chromium report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: e2e/playwright-report
          retention-days: 7

  mobile-safari:
    name: Mobile Safari — responsive suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit

      - name: Run Mobile Safari responsive suite
        run: npx playwright test --project=mobile-safari

      - name: Upload Mobile Safari report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mobile-safari
          path: e2e/playwright-report
          retention-days: 7
